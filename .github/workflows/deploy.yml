name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # -------------------------------------------------
      # Install dependencies
      # -------------------------------------------------

      - name: Install main site dependencies
        run: npm ci

      - name: Install fencing dependencies
        working-directory: fencing
        run: npm ci

      # -------------------------------------------------
      # Build and validate
      # -------------------------------------------------

      - name: Build and validate
        run: npm run build

      # -------------------------------------------------
      # Assemble GitHub Pages artifact
      # -------------------------------------------------

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site

          # Copy existing static website.
          cp -a index.html _site/
          cp -a credit.html _site/
          cp -a hobbies.html _site/
          cp -a wuwaTeardown.html _site/
          cp -a wuwaTeardown.md _site/
          cp -a mobile.css _site/
          cp -a style.css _site/
          cp -a src _site/
          cp -a WuWafiles _site/

          # Copy fencing React build.
          mkdir -p _site/fencing
          cp -a fencing/dist/. _site/fencing/

      - name: Validate Pages artifact
        run: node tools/build.js _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
